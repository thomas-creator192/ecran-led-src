<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Écran LED — SRC La Clayette</title>
<link rel="stylesheet" href="/css/ecran.css">
</head>
<body>
<div id="zone">
  <div id="scene">

    <div id="vue-score" class="vue">
      <div class="equipe dom">
        <img class="blason" src="/img/logo-src.png" alt="">
        <div class="nom" id="nom-dom">SRC</div>
      </div>
      <div class="centre">
        <div class="chrono" id="ligne-chrono">
          <span id="chrono">00:00</span><span class="add" id="add"></span>
        </div>
        <div class="score">
          <span class="chiffre" id="s-dom">0</span><span class="tiret">-</span><span class="chiffre" id="s-ext">0</span>
        </div>
        <div class="tab-final" id="tab-final" hidden></div>
      </div>
      <div class="equipe ext">
        <svg class="blason blason-ext" viewBox="0 0 100 116" aria-hidden="true">
          <path d="M50 5 L93 19 V58 C93 86 74 103 50 111 C26 103 7 86 7 58 V19 Z"/>
          <text x="50" y="72" text-anchor="middle">EXT</text>
        </svg>
        <div class="nom" id="nom-ext">VISITEUR</div>
      </div>
    </div>

    <div id="vue-logo" class="vue">
      <img class="grand-logo" src="/img/logo-src.png" alt="">
      <div class="club">
        <div class="club-nom">SRC FOOT</div>
        <div class="club-ville">LA CLAYETTE</div>
      </div>
    </div>

    <div id="vue-tab" class="vue vue-tab">
      <div class="tab-ligne dom">
        <div class="tab-equipe">
          <img class="tab-blason" src="/img/logo-src.png" alt="">
          <div class="tab-nom" id="tab-nom-dom">SRC</div>
        </div>
        <div class="tab-tirs" id="tirs-dom"></div>
        <div class="tab-score" id="tab-s-dom">0</div>
      </div>
      <div class="tab-ligne ext">
        <div class="tab-equipe">
          <svg class="tab-blason blason-ext" viewBox="0 0 100 116" aria-hidden="true">
          <path d="M50 5 L93 19 V58 C93 86 74 103 50 111 C26 103 7 86 7 58 V19 Z"/>
          <text x="50" y="72" text-anchor="middle">EXT</text>
        </svg>
          <div class="tab-nom" id="tab-nom-ext">VISITEUR</div>
        </div>
        <div class="tab-tirs" id="tirs-ext"></div>
        <div class="tab-score" id="tab-s-ext">0</div>
      </div>
    </div>

    <div id="vue-spots" class="spots"></div>

    <div id="but" class="but">
      <div class="but-fond"></div>
      <img class="but-logo" src="/img/logo-src.png" alt="">
      <div class="but-textes">
        <div class="but-texte">BUT !</div>
        <div class="but-equipe" id="but-equipe">VISITEUR</div>
      </div>
    </div>

    <div id="vainqueur" class="but vainqueur">
      <div class="but-fond"></div>
      <img class="but-logo" src="/img/logo-src.png" alt="">
      <div class="but-textes">
        <div class="vainqueur-equipe" id="vainqueur-equipe">SRC</div>
        <div class="vainqueur-texte">VAINQUEUR !</div>
      </div>
    </div>

    <!-- Animation Philibert CVS : au démarrage du player et avant son extinction (20 s). -->
    <div id="intro" class="intro">
      <div class="intro-etape intro-logo">
        <img class="pc-monogramme" src="/img/philibert-cvs-monogramme.svg" alt="">
        <div class="pc-boite"><div class="pc-marque ajuster">PHILIBERT <span class="pc-cvs">CVS</span></div></div>
      </div>
      <div class="intro-etape intro-service s1">
        <span class="pc-num">#1</span>
        <span class="ajuster">Vente écrans LED</span>
        <span class="pc-detail ajuster">intérieurs &amp; extérieurs</span>
      </div>
      <div class="intro-etape intro-service s2"><span class="pc-num">#2</span><span class="ajuster">Création de sites web</span></div>
      <div class="intro-etape intro-service s3"><span class="pc-num">#3</span><span class="ajuster">Gestion des réseaux sociaux</span></div>
      <div class="intro-etape intro-contact">
        <img class="intro-qr" src="/api/contact.svg?fiche=2" alt="">
        <div class="intro-coord">
          <div class="pc-contact-nom">PHILIBERT <span class="pc-cvs">CVS</span></div>
          <div class="ajuster">philibertcvs@gmail.com</div>
          <div class="ajuster">06 63 98 96 86</div>
          <div class="intro-scan ajuster">Scannez pour enregistrer le contact</div>
        </div>
      </div>
    </div>

  </div>
</div>
<script src="/js/commun.js"></script>
<script src="/js/ecran.js"></script>
</body>
</html>
